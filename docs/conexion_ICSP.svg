<text x="800" y="395" font-size="20" fill="#c0392b" font-weight="bold">pin 2 (+5V): NO se conecta</text>
<text x="60" y="940" font-size="30" font-weight="bold" fill="#1b1b1b">Nano programador (vista de arriba, USB a la izquierda)</text>
<text x="60" y="975" font-size="22" fill="#444">Cada pin de color va con un jumper al pin de J7 del mismo color.</text>
